name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Smoke test CLI with the offline mock judge
        run: jck run --data examples/synthetic_support_answers.jsonl --judge mock --synthetic --out reports/demo.md
      - name: Smoke test multi-criteria labels with the offline mock judge
        run: jck run --data examples/synthetic_multi_criteria.jsonl --judge mock --synthetic --out reports/multi.md
      - name: Smoke test judge A/B with the offline mocks
        run: jck ab --data examples/synthetic_support_answers.jsonl --judge-a mock --judge-b mock:strict --synthetic --out reports/ab.md
      - name: Smoke test blank labeling sheet export
        run: jck sheet --data examples/synthetic_support_answers.jsonl --out reports/sheet.csv --seed 1
