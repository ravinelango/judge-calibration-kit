[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judge-calibration-kit"
version = "0.1.0"
description = "Measure how well an LLM-as-a-judge agrees with human labels before you trust it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravin Elango" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]

[project.scripts]
jck = "judge_calibration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_calibration"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
